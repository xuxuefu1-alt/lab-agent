groups:
  - name: lab-agent-api
    rules:
      - alert: BackendScrapeMissing
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Lab Agent backend metrics endpoint is unavailable"
          description: "Prometheus has failed to scrape the backend for at least two minutes."

      - alert: BackendHigh5xxRate
        expr: |
          (
            sum(rate(lab_agent_http_requests_total{job="backend",status=~"5.."}[5m]))
            / clamp_min(sum(rate(lab_agent_http_requests_total{job="backend"}[5m])), 0.001) > 0.05
          )
          and sum(increase(lab_agent_http_requests_total{job="backend"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lab Agent backend 5xx rate is elevated"
          description: "More than 5% of backend requests have returned 5xx responses for five minutes."

      - alert: BackendHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(lab_agent_http_request_duration_seconds_bucket{job="backend"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lab Agent backend p95 latency is high"
          description: "Backend request p95 latency has exceeded two seconds for ten minutes."
