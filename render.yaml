services:
  - type: web
    name: lab-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: demo
      - key: mysql_url
        value: sqlite:///./lab_agent.db
      - key: JWT_SECRT_KEY
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "24"
      - key: JWT_ALGORITHM
        value: HS256
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: lab-agent-frontend
    runtime: static
    rootDir: fronted
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
