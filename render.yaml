services:
  - type: web
    name: lab-agent-backend
    runtime: python
    plan: 1c-2g
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: lab-agent-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: mysql_url
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRT_KEY
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "24"
      - key: JWT_ALGORITHM
        value: HS256
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: lab-agent-frontend
    runtime: static
    rootDir: fronted
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
